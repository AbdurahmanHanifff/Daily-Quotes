name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - run: REQUIRE_NATIVE=1 npm run build
      - run: npm install --no-save playwright@1.55.0 && npx playwright install --with-deps chromium
      - run: node tests/e2e.js
      - uses: actions/upload-artifact@v4
        with: { name: quote-feed-web, path: www }
  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: REQUIRE_NATIVE=1 npm run build
      - run: npx cap add android && npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with: { name: quote-feed-debug-apk, path: android/app/build/outputs/apk/debug/app-debug.apk }
  ios:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
      - run: npm ci
      - run: REQUIRE_NATIVE=1 npm run build
      - run: npx cap add ios && npx cap sync ios
      - name: Compile for the simulator (no signing)
        run: xcodebuild -project ios/App/App.xcodeproj -scheme App -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
